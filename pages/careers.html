<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="Explore MyTalks careers, benefits, company culture, and apply for open positions." />
  <link rel="canonical" href="https://mytalk.in/pages/careers" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Careers at MyTalks — Open Roles & Culture" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Careers at MyTalks — Open Roles & Culture" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/dark.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  
  <script src="../js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-root"></div>
  <main id="main" class="page-main">
    <section class="page-hero">
      <div class="container">
        <h1>Careers</h1>
        <p>Help us make emotional support more accessible and human.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="grid-3 mb-8">
          <article class="feature-item"><div class="feature-item__icon"><i class="fa-solid fa-heart-pulse"></i></div><h3>Meaningful work</h3><p>Build product that helps people feel less alone.</p></article>
          <article class="feature-item"><div class="feature-item__icon"><i class="fa-solid fa-house-laptop"></i></div><h3>Flexible remote</h3><p>Collaborate from where you do your best work.</p></article>
          <article class="feature-item"><div class="feature-item__icon"><i class="fa-solid fa-graduation-cap"></i></div><h3>Growth budget</h3><p>Learning stipends and mentorship.</p></article>
        </div>
        <h2>Open Positions</h2>
        <div class="grid-2 mt-6" data-careers-list style="display:grid;gap:1rem"></div>
        <h2 class="mt-8" id="apply">Apply</h2>
        <form class="card mt-4" name="career" data-demo-form data-success="Application received (demo).">
          <div class="form-row">
            <div class="form-group"><label>Name</label><input class="form-control" name="name" required /></div>
            <div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" required /></div>
          </div>
          <div class="form-group"><label>Role</label><input class="form-control" name="role" required /></div>
          <div class="form-group"><label>Portfolio / LinkedIn</label><input class="form-control" name="link" /></div>
          <div class="form-group"><label>Why MyTalks?</label><textarea class="form-textarea" name="why" required></textarea></div>
          <div class="honeypot" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off" /></div>
          <button class="btn btn--primary" type="submit">Submit application</button>
        </form>
      </div>
    </section>

  </main>
  <div id="footer-root"></div>
  <div id="cookie-root"></div>
  <script src="../js/includes.js" defer></script>
  <script src="../js/data-loader.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/forms.js" defer></script>
</body>
</html>
