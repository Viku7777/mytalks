<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact MyTalks — Support, Partnerships & Press</title>
  <meta name="description" content="Contact MyTalks by form, email, phone, or WhatsApp. Find office address, business hours, and social links." />
  <link rel="canonical" href="https://mytalk.in/pages/contact" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contact MyTalks — Support, Partnerships & Press" />
  <meta property="og:description" content="Contact MyTalks by form, email, phone, or WhatsApp. Find office address, business hours, and social links." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1516302759342-fd024b64ad2b?w=1200&h=630&fit=crop" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contact MyTalks — Support, Partnerships & Press" />
  <meta name="twitter:description" content="Contact MyTalks by form, email, phone, or WhatsApp. Find office address, business hours, and social links." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/dark.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  
  <script src="../js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-root"></div>
  <main id="main" class="page-main">
    <section class="page-hero">
      <div class="container">
        <h1>Contact Us</h1>
        <p>We’re here to help—reach out anytime.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <form class="card" name="contact" data-demo-form data-success="Message sent. We'll reply soon.">
          <div class="form-group"><label for="name">Name</label><input class="form-control" id="name" name="name" required /></div>
          <div class="form-group"><label for="email">Email</label><input class="form-control" type="email" id="email" name="email" required /></div>
          <div class="form-group"><label for="subject">Subject</label><input class="form-control" id="subject" name="subject" required /></div>
          <div class="form-group"><label for="message">Message</label><textarea class="form-textarea" id="message" name="message" required></textarea></div>
          <div class="honeypot" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off" /></div>
          <button class="btn btn--primary" type="submit">Send message</button>
        </form>
        <div>
          <div class="contact-info-item"><i class="fa-solid fa-envelope"></i><div><strong>Email</strong><p>hello@mytalk.in</p></div></div>
          <div class="contact-info-item"><i class="fa-solid fa-phone"></i><div><strong>Phone</strong><p>+91 98765 43210</p></div></div>
          <div class="contact-info-item"><i class="fa-brands fa-whatsapp"></i><div><strong>WhatsApp</strong><p>+91 98765 43210</p></div></div>
          <div class="contact-info-item"><i class="fa-solid fa-location-dot"></i><div><strong>Office</strong><p>12 Harmony Street, Indiranagar, Bengaluru 560038</p></div></div>
          <div class="contact-info-item"><i class="fa-solid fa-clock"></i><div><strong>Business Hours</strong><p>Mon–Sun, 9:00–21:00 IST</p></div></div>
          <iframe class="map-embed mt-4" title="Office location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=Indiranagar%20Bengaluru&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
        </div>
      </div>
    </section>

  </main>
  <div id="footer-root"></div>
  <div id="cookie-root"></div>
  <script src="../js/includes.js" defer></script>
  <script src="../js/data-loader.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/forms.js" defer></script>
</body>
</html>
