  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />

  <script src="../js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-root"></div>
  <main id="main" class="page-main">
    <section class="page-hero">
      <div class="container">
        <h1>Find an Advisor</h1>
        <p>Search trusted listeners who match your needs.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters">
          <input class="form-control" type="search" placeholder="Search by name or specialty" data-filter-search aria-label="Search advisors" />
          <select class="form-select" data-filter-gender aria-label="Gender"><option value="">Gender</option><option>Female</option><option>Male</option></select>
          <select class="form-select" data-filter-language aria-label="Language"><option value="">Language</option><option>English</option><option>Hindi</option><option>Spanish</option><option>Tamil</option><option>Gujarati</option><option>Malayalam</option><option>Marathi</option><option>Mandarin</option></select>
          <select class="form-select" data-filter-specialty aria-label="Specialization"><option value="">Specialization</option><option>Relationship Guidance</option><option>Breakup Support</option><option>Marriage Discussions</option><option>Family Problems</option><option>Career Stress</option><option>Loneliness</option><option>Life Decisions</option><option>Emotional Support</option><option>General Conversation</option><option>Dating Advice</option><option>Stress Support</option><option>Friendship Issues</option><option>Breakup Recovery</option></select>
          <select class="form-select" data-filter-rating aria-label="Minimum rating"><option value="">Rating</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option><option value="4.9">4.9+</option></select>
        </div>
        <p class="mb-6" data-advisors-status aria-live="polite" aria-busy="true">
          <span class="sr-only">Loading advisors…</span>
          <span class="skeleton skeleton--xl" aria-hidden="true"></span>
        </p>
        <div class="grid-3" data-advisors-grid aria-busy="true">
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
          <article class="card advisor-card advisor-card--skeleton" aria-hidden="true"><div class="advisor-card__media"><span class="skeleton skeleton--avatar"></span><div><span class="skeleton skeleton--lg"></span><span class="skeleton skeleton--block"></span></div></div><span class="skeleton skeleton--block"></span><span class="skeleton skeleton--md"></span></article>
        </div>
      </div>
    </section>

  </main>
  <div id="footer-root"></div>
  <div id="cookie-root"></div>
  <script src="../js/includes.js" defer></script>
  <script src="../js/data-loader.js" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/advisors.js" defer></script>
</body>
</html>
