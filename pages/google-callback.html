<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Signing in — MyTalk</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Poppins, system-ui, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 1.5rem;
      text-align: center;
    }
    .spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(255, 255, 255, 0.22);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    p {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="wrap" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Signing you in…</p>
  </div>
  <script>
    (function () {
      var TOKEN_KEY = "mytalks-google-id-token";
      var NEXT_KEY = "mytalks-google-id-token-next";
      var ERR_KEY = "mytalks-google-oauth-error";
      var PENDING_KEY = "mytalks-google-redirect";
      var hash = String(location.hash || "").replace(/^#/, "");
      var params = new URLSearchParams(hash);
      var idToken = params.get("id_token");
      var oauthErr = params.get("error");
      try {
        if (idToken) {
          sessionStorage.setItem(TOKEN_KEY, idToken);
          localStorage.setItem(TOKEN_KEY, idToken);
          sessionStorage.setItem(PENDING_KEY, "1");
          localStorage.setItem(PENDING_KEY, "1");
        }
        if (oauthErr) {
          sessionStorage.setItem(ERR_KEY, String(oauthErr).slice(0, 120));
        }
      } catch (e) {}
      var next = "/pages/login";
      try {
        next =
          sessionStorage.getItem(NEXT_KEY) ||
          localStorage.getItem(NEXT_KEY) ||
          "/pages/login";
      } catch (e) {}
      if (next.charAt(0) !== "/") next = "/pages/login";
      location.replace(next);
    })();
  </script>
</body>
</html>
