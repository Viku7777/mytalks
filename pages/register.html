<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Create Your MyTalks Account</title>
  <meta name="description" content="Create a MyTalks account to book sessions, track invoices, and earn referral rewards." />
  <link rel="canonical" href="https://mytalknow.com/pages/register" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Register — Create Your MyTalks Account" />
  <meta property="og:description" content="Create a MyTalks account to book sessions, track invoices, and earn referral rewards." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1516302759342-fd024b64ad2b?w=1200&h=630&fit=crop" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Register — Create Your MyTalks Account" />
  <meta name="twitter:description" content="Create a MyTalks account to book sessions, track invoices, and earn referral rewards." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link rel="stylesheet" href="../css/dark.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  
  <script src="../js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="header-root"></div>
  <main id="main" class="page-main">
    <section class="section section--tight">
      <div class="container">
        <div class="auth-panel">
          <h1>Create your account</h1>
          <p>Join MyTalks for private, judgment-free support.</p>
          <form class="mt-6" data-register-form>
            <p class="form-error" data-auth-error hidden role="alert"></p>
            <div class="form-group"><label for="name">Name</label><input class="form-control" id="name" name="name" required autocomplete="name" /></div>
            <div class="form-group"><label for="email">Email</label><input class="form-control" type="email" id="email" name="email" required autocomplete="email" /></div>
            <div class="form-group"><label for="phone">Phone <span class="hint">(optional)</span></label><input class="form-control" type="tel" id="phone" name="phone" pattern="[0-9+\-\s]{8,}" autocomplete="tel" /></div>
            <div class="form-row">
              <div class="form-group"><label for="password">Password</label><input class="form-control" type="password" id="password" name="password" required minlength="6" autocomplete="new-password" /></div>
              <div class="form-group"><label for="confirm">Confirm Password</label><input class="form-control" type="password" id="confirm" name="confirm" required minlength="6" autocomplete="new-password" /></div>
            </div>
            <label class="form-check mb-4"><input type="checkbox" name="terms" required /> I agree to the <a href="terms">Terms</a> and <a href="privacy">Privacy Policy</a>.</label>
            <div class="honeypot" aria-hidden="true"><input type="text" name="website" tabindex="-1" autocomplete="off" /></div>
            <button class="btn btn--primary btn--block" type="submit">Create account</button>
          </form>
          <div class="auth-divider">or</div>
          <div class="social-auth">
            <button type="button" class="btn btn--ghost btn--block" data-social-auth="Google"><i class="fa-brands fa-google"></i> Continue with Google</button>
          </div>
          <p class="text-center mt-6">Already have an account? <a href="login">Log in</a></p>
        </div>
      </div>
    </section>

  </main>
  <div id="footer-root"></div>
  <div id="cookie-root"></div>
  <script src="../js/includes.js" defer></script>
  <script src="../js/data-loader.js" defer></script>
  <script src="../js/main.js" defer></script>
</body>
</html>
